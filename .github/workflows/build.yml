name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write           # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make sure Android SDK 34 is installed
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualRec-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DualRec.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DualRec.apk \
            --title "DualRec - latest build" \
            --notes "Automatic build #${{ github.run_number }} from commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
